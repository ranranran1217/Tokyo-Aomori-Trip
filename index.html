<script>
 
function toggleDark(){
document.body.classList.toggle("dark");
localStorage.setItem(
"darkMode",
document.body.classList.contains("dark")
);
}
 
if(localStorage.getItem("darkMode")==="true"){
document.body.classList.add("dark");
}
 
 
const notes=document.getElementById("notes");
 
notes.value=
localStorage.getItem("tripNotes")||"";
 
notes.addEventListener("input",()=>{
localStorage.setItem(
"tripNotes",
notes.value
);
});
 
 
function calc(){
 
const hotel=
Number(document.getElementById("hotel").value)||0;
 
const food=
Number(document.getElementById("food").value)||0;
 
const shopping=
Number(document.getElementById("shopping").value)||0;
 
const other=
Number(document.getElementById("other").value)||0;
 
const total=
hotel+food+shopping+other;
 
document.getElementById("total").innerText=total;
 
localStorage.setItem("hotel",hotel);
localStorage.setItem("food",food);
localStorage.setItem("shopping",shopping);
localStorage.setItem("other",other);
}
 
["hotel","food","shopping","other"].forEach(id=>{
 
const el=document.getElementById(id);
 
el.value=
localStorage.getItem(id)||0;
 
el.addEventListener("input",calc);
 
});
 
calc();
 
</script>
