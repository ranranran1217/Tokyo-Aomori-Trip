<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>💰 东京青森旅行分账</title>

<style>

:root{
  --bg:#f5f7fa;
  --card:#ffffff;
  --text:#222;
}

.dark{
  --bg:#111827;
  --card:#1f2937;
  --text:#f8fafc;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h1{
  text-align:center;
}

input,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
}

label{
  display:block;
  margin-top:10px;
}

button{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  cursor:pointer;
}

.add{
  background:#2563eb;
  color:white;
  margin-top:15px;
}

.darkbtn{
  background:#111827;
  color:white;
}

.delete{
  background:#dc2626;
  color:white;
  padding:6px 10px;
}

.persons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:10px;
}

.item{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.result{
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
}

.receive{
  background:#dcfce7;
  color:#166534;
}

.pay{
  background:#fee2e2;
  color:#991b1b;
}

.total{
  font-size:26px;
  font-weight:bold;
  color:#dc2626;
}
</style>
</head>

<body>

<div class="container">

<h1>💰 东京青森旅行分账</h1>

<div class="card">

<button class="darkbtn"
onclick="toggleDark()">
🌙 深色模式
</button>

</div>

<div class="card">

<h2>新增消费</h2>

<label>项目名称</label>
<input id="name" placeholder="例如：包车">

<label>金额（日元）</label>
<input id="amount" type="number">

<label>付款人</label>
<select id="payer">
<option>Rena</option>
<option>妞妈</option>
<option>明希</option>
<option>琪妈</option>
</select>

<label>参与人员</label>

<div class="persons">

<label>
<input type="checkbox" value="Rena" checked>
Rena
</label>

<label>
<input type="checkbox" value="妞妈" checked>
妞妈
</label>

<label>
<input type="checkbox" value="明希" checked>
明希
</label>

<label>
<input type="checkbox" value="琪妈" checked>
琪妈
</label>

</div>

<button class="add"
onclick="addExpense()">
＋ 添加消费
</button>

</div>

<div class="card">

<h2>消费记录</h2>

<div id="expenseList"></div>

</div>

<div class="card">

<h2>统计</h2>

<div class="total" id="grandTotal">
¥0
</div>

<p id="summary"></p >

</div>

<div class="card">

<h2>结算结果</h2>

<div id="settlement"></div>

</div>

</div>

<script>

let expenses =
JSON.parse(
localStorage.getItem("trip_split")
) || [];

function toggleDark(){
 document.body.classList.toggle("dark");
}

function save(){
 localStorage.setItem(
   "trip_split",
   JSON.stringify(expenses)
 );
}

function addExpense(){

 const name =
   document.getElementById("name").value.trim();

 const amount =
   Number(document.getElementById("amount").value);

 const payer =
   document.getElementById("payer").value;

 const checks =
   document.querySelectorAll(
   '.persons input[type="checkbox"\]:checked');

 const participants =
   [...checks].map(x=>x.value);

 if(!name || !amount || participants.length===0){
   alert("请填写完整信息");
   return;
 }

 expenses.push({
   name,
   amount,
   payer,
   participants
 });

 document.getElementById("name").value="";
 document.getElementById("amount").value="";

 save();
 render();

}

function deleteExpense(index){

 expenses.splice(index,1);

 save();
 render();

}

function render(){

 const people={
   "Rena":{paid:0,share:0},
   "妞妈":{paid:0,share:0},
   "明希":{paid:0,share:0},
   "琪妈":{paid:0,share:0}
 };

 const list =
 document.getElementById("expenseList");

 list.innerHTML="";

 expenses.forEach((e,index)=>{

   people[e.payer].paid += e.amount;

   const per =
   e.amount / e.participants.length;

   e.participants.forEach(p=>{
     people[p].share += per;
   });

   list.innerHTML += `
   <div class="item">

   <strong>${e.name}</strong>

   <br>

   ¥${e.amount.toLocaleString()}

   <br>

   付款人：
   ${e.payer}

   <br>

   参与：
   ${e.participants.join(" / ")}

   <br><br>

   <button
   class="delete"
   onclick="deleteExpense(${index})">
   删除
   </button>

   </div>
   `;
 });

 const total =
 expenses.reduce(
 (a,b)=>a+b.amount,0);

 document.getElementById(
 "grandTotal"
 ).innerText =
 "¥"+total.toLocaleString();

 document.getElementById(
 "summary"
 ).innerText =
 `共 ${expenses.length} 笔消费`;

 let resultHtml="";

 Object.keys(people).forEach(name=>{

   const paid=
   people[name].paid;

   const share=
   people[name].share;

   const diff=
   paid-share;

   if(diff>=0){

     resultHtml += `
     <div class="result receive">

     ✅ ${name}

     <br>
     已支付：¥${Math.round(paid).toLocaleString()}

     <br>
     应承担：¥${Math.round(share).toLocaleString()}

     <br>
     最终应收：¥${Math.round(diff).toLocaleString()}

     </div>
     `;

   }else{

     resultHtml += `
     <div class="result pay">

     💸 ${name}

     <br>
     已支付：¥${Math.round(paid).toLocaleString()}

     <br>
     应承担：¥${Math.round(share).toLocaleString()}

     <br>
     最终应补：¥${Math.round(Math.abs(diff)).toLocaleString()}

     </div>
     `;
   }

 });

 document.getElementById(
 "settlement"
 ).innerHTML =
 resultHtml;

}

render();

</script>

</body>
</html>
